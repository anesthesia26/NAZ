<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAZ - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .login-container { background: #ffffff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); width: 100%; max-width: 420px; text-align: center; }
        .logo-area { margin-bottom: 25px; }
        .logo-area h1 { color: #0b4f3b; font-size: 32px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
        .logo-area p { color: #666; font-size: 15px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #444; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .input-wrapper input:focus { border-color: #0b4f3b; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }
        .submit-btn { background-color: #0b4f3b; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        .submit-btn:hover { background-color: #093c2e; }
        .footer-links { margin-top: 25px; font-size: 14px; }
        .footer-links a { color: #0b4f3b; text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
        .footer-text { color: #777; }
        .developer-footer { text-align: center; margin-top: 30px; font-size: 11px; color: #888; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <h1>NAZ</h1>
            <p>مرحباً بعودتك، قم بتسجيل الدخول للوصول إلى حسابك</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    <i class="fa-regular fa-eye-slash"></i>
                </div>
            </div>
            <button type="submit" class="submit-btn">
                <span>تسجيل الدخول</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </form>
        <div class="footer-links">
            <span class="footer-text">ليس لديك حساب؟ </span>
            <a href="#">إنشاء حساب جديد</a>
        </div>
        <div class="developer-footer">
            By:Komail Nabeel / B.M.T Of Anesthesia & ICU / WBD
        </div>
    </div>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtJY8Qd_wiXqMCaYIoitiWY9_deYwEW2o",
            authDomain: "nazq-b8c70.firebaseapp.com",
            projectId: "nazq-b8c70",
            storageBucket: "nazq-b8c70.firebasestorage.app",
            messagingSenderId: "532148139006",
            appId: "1:532148139006:web:ed22524754bc0cc7db86af",
            measurementId: "G-1ERJL6JLPW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('تم تسجيل الدخول بنجاح عبر Firebase!');
                // الانتقال المباشر للوحة التحكم في غيت هوب بيجيز
                window.location.href = "dashboard.html";
            } catch (error) {
                alert('خطأ في تسجيل الدخول: ' + error.message);
            }
        });
    </script>
</body>
</html>
